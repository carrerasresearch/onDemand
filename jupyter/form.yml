cluster: minastirith
form:
  - jupyter_image
  - modules
  - extra_jupyter_args
  - bc_num_hours
  - use_gpu
  - num_cores
  - memory
  - bc_email_on_started
attributes:
  # Keys must match the images table in template/script.sh.erb.
  jupyter_image:
    label: "Image"
    widget: "select"
    # Default stays CUDA 11 so existing users keep their Python packages;
    # OOD remembers each user's last choice.
    value: "cuda11"
    options:
      - ["CUDA 13 (Python 3.12, JupyterLab 4.5, PyTorch 2.10)", "cuda13"]
      - ["CUDA 11 (Python 3.10, JupyterLab 4.4, PyTorch 1.12)", "cuda11"]
    help: |
      Both include Cell Ranger 9.0.1 and Cell Ranger ARC 2.0.2 and run on CPU
      or GPU nodes. Python packages you install with pip are kept per Python
      version, so packages installed under one image are not visible in the other.
  modules: python
  extra_jupyter_args: ""
  memory:
    widget: number_field
    max: 200
    min: 16
    step: 1
    value: 16
    label: Memory (Gb)
    help: RSS Memory
    display: true
  use_gpu:
    label: Use GPU
    widget: select
    options:
      - [ false, test2, data-max-num-cores: 16, data-set-bc-queue: test ]
      - [ true, test-gpu, data-max-num-cores: 4, data-set-bc-queue: test-gpu ]
  num_cores:
    label: Number of CPUs
    widget: number_field
    value: 4
    max: 16
    min: 4
    help: Specify the number of CPUs to request. GPU nodes have a CPU limit of 4.
    display: true
  bc_queue:
    widget: hidden_field
    value: "test"
    display: false
