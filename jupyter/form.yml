cluster: minastirith
form:
  - jupyter_image
  - modules
  - extra_jupyter_args
  - bc_num_hours
  - use_gpu
  - num_cores
  - memory
  - bc_email_on_started
attributes:
  # Keys must match the images table in template/script.sh.erb.
  jupyter_image:
    label: "Image"
    widget: "select"
    # Images are named by build month. The default stays 2026.02 (the image
    # Jupyter Lab always used) so existing users keep their Python packages;
    # OOD remembers each user's last choice.
    value: "2026.02"
    options:
      - ["2026.11 (Python 3.12, JupyterLab 4.6, PyTorch 2.14 with CUDA 13.0, Cell Ranger 10.1)", "2026.11"]
      - ["2026.02.1 (Python 3.12, JupyterLab 4.5, PyTorch 2.10 with CUDA 12.8, Cell Ranger 9.0)", "2026.02.1"]
      - ["2026.02 (Python 3.10, JupyterLab 4.4, PyTorch 1.12 with CUDA 11.6, Cell Ranger 9.0)", "2026.02"]
    help: |
      All images run on CPU or GPU nodes and include Cell Ranger ARC 2.0.2.
      Python packages you install with pip are kept per Python version, so
      packages installed under one Python version are not visible in another.
    display: true
  modules: python
  extra_jupyter_args: ""
  memory:
    widget: number_field
    max: 200
    min: 16
    step: 1
    value: 16
    label: Memory (Gb)
    help: RSS Memory
    display: true
  use_gpu:
    label: Use GPU
    widget: select
    options:
      - [ false, test2, data-max-num-cores: 16, data-set-bc-queue: test ]
      - [ true, test-gpu, data-max-num-cores: 4, data-set-bc-queue: test-gpu ]
    display: true
  num_cores:
    label: Number of CPUs
    widget: number_field
    value: 4
    max: 16
    min: 4
    help: Specify the number of CPUs to request. GPU nodes have a CPU limit of 4.
    display: true
  bc_queue:
    widget: hidden_field
    value: "test"
    display: false
