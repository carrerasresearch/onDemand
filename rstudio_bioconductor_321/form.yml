---
cluster: "minastirith"
attributes:
  # Keys must match the IMAGES table in template/script.sh.erb.
  bioc_version:
    label: "Bioconductor version"
    widget: "select"
    options:
      - ["3.23 (R 4.6, RStudio 2026.11)", "3.23"]
      - ["3.21 (R 4.5.1)", "3.21"]
    help: |
      Each version has its own R package library, because packages built for
      one R version do not work with another. Packages you install under 3.21
      have to be reinstalled under 3.23.
    display: true
  memory:
    widget: "number_field"
    max: 200
    min: 3
    step: 1
    value: 3
    label: "Memory (Gb)"
    help: "RSS Memory"
    display: true
  custom_cpus:
    label: "Number of CPUs"
    widget: "number_field"
    value: 1
    min: 1
    max: 16  
    help: "Specify the number of CPUs to request."
    display: true  
form:
  - bioc_version
  - bc_num_hours
  - custom_cpus  
  - memory
  - bc_email_on_started
